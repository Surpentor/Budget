<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#f7efe5; --surface:#fffaf3; --surface-2:#f2e3d1; --ink:#35163d; --muted:#735b70;
  --line:#d9b995; --deep:#5a195e; --deep-ink:#fff8fb; --lime:#f4bfd5; --lime-ink:#53113d; --coral:#ef218c;
  --mike:#753c94; --mike-soft:#eadcf3; --mike-ink:#fff; --sara:#e91e8d; --sara-soft:#ffe0ee; --sara-ink:#160b17;
  --shared:#b66b32; --shared-soft:#f2dfc7; --shared-ink:#160b17; --leather:#b66b32; --cream:#fff5e8;
  --shadow:0 20px 54px rgba(74,25,76,.14);
  --pink:var(--sara); --purple:var(--mike); --purple-dark:var(--deep);
  --tan:var(--leather); --tan-dark:var(--shared); --card:var(--surface);
  --danger:#b3261e; --green:#2e7d32;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1d111e; --surface:#2b182d; --surface-2:#38223a; --ink:#fff4f8; --muted:#d5b9cd;
    --line:#684561; --deep:#f0cbe9; --deep-ink:#35163d; --lime:#e995b9; --lime-ink:#3b0d2d; --coral:#ff58aa;
    --mike:#c18be0; --mike-soft:#472756; --mike-ink:#160b17; --sara:#ff64b2; --sara-soft:#54223d; --sara-ink:#35163d;
    --shared:#d79a64; --shared-soft:#503a29; --shared-ink:#160b17; --leather:#d79a64; --cream:#fff0e2;
    --shadow:0 24px 70px rgba(0,0,0,.38);
    --danger:#ff9d94; --green:#8fd694;
  }
}
/* manual theme override (theme toggle) */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d111e; --surface:#2b182d; --surface-2:#38223a; --ink:#fff4f8; --muted:#d5b9cd;
  --line:#684561; --deep:#f0cbe9; --deep-ink:#35163d; --lime:#e995b9; --lime-ink:#3b0d2d; --coral:#ff58aa;
  --mike:#c18be0; --mike-soft:#472756; --mike-ink:#160b17; --sara:#ff64b2; --sara-soft:#54223d; --sara-ink:#35163d;
  --shared:#d79a64; --shared-soft:#503a29; --shared-ink:#160b17; --leather:#d79a64; --cream:#fff0e2;
  --shadow:0 24px 70px rgba(0,0,0,.38);
  --pink:var(--sara); --purple:var(--mike); --purple-dark:var(--deep);
  --tan:var(--leather); --tan-dark:var(--shared); --card:var(--surface);
  --danger:#ff9d94; --green:#8fd694;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f7efe5; --surface:#fffaf3; --surface-2:#f2e3d1; --ink:#35163d; --muted:#735b70;
  --line:#d9b995; --deep:#5a195e; --deep-ink:#fff8fb; --lime:#f4bfd5; --lime-ink:#53113d; --coral:#ef218c;
  --mike:#753c94; --mike-soft:#eadcf3; --mike-ink:#fff; --sara:#e91e8d; --sara-soft:#ffe0ee; --sara-ink:#160b17;
  --shared:#b66b32; --shared-soft:#f2dfc7; --shared-ink:#160b17; --leather:#b66b32; --cream:#fff5e8;
  --shadow:0 20px 54px rgba(74,25,76,.14);
  --pink:var(--sara); --purple:var(--mike); --purple-dark:var(--deep);
  --tan:var(--leather); --tan-dark:var(--shared); --card:var(--surface);
  --danger:#b3261e; --green:#2e7d32;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0; min-width:320px; color:var(--ink); line-height:1.45;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background-color:var(--bg);
  background-image:linear-gradient(45deg,transparent 46%,color-mix(in srgb,var(--shared) 8%,transparent) 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,color-mix(in srgb,var(--sara) 7%,transparent) 46% 54%,transparent 54%);
  background-size:34px 34px;
  padding-top:52px;
}
button{font:inherit;color:inherit}
input,select{font:inherit}
/* ---- save bar ---- */
#savebar{
  position:fixed; top:0; left:0; right:0; z-index:60;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 12px; background:#43104b; color:#fff8fb; font-size:13px; font-weight:700;
}
#savebar .saving{color:#ffd9e8}
#savebar .saved{color:#b9f0c0}
#savebar .offline{color:#ffcf9e}
#reset-btn{
  background:transparent; border:1px solid rgba(255,248,251,.5); color:#fff8fb;
  border-radius:8px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
}
#reset-btn:hover{background:rgba(255,248,251,.12)}
/* ---- hero header ---- */
.hero{
  margin:14px auto 0; width:min(860px,calc(100% - 24px));
  padding:32px 30px; position:relative; overflow:hidden;
  border-radius:26px 26px 12px 12px; border-bottom:10px solid var(--leather);
  color:#fff8fb; background:linear-gradient(112deg,rgba(67,16,75,.98) 0 48%,rgba(114,28,117,.93) 72%,rgba(232,30,141,.88)),#5a195e;
  box-shadow:var(--shadow);
}
.hero::before{
  content:""; position:absolute; inset:0; opacity:.26; pointer-events:none;
  background-image:linear-gradient(45deg,transparent 42%,#fff5e8 42% 48%,transparent 48% 52%,#ef218c 52% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,#fff5e8 42% 48%,transparent 48% 52%,#9d4db5 52% 58%,transparent 58%);
  background-size:74px 74px; background-position:right -8px top -8px;
  mask-image:linear-gradient(90deg,transparent 30%,#000 78%);
  -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 78%);
}
.hero .eyebrow{
  position:relative; z-index:1; display:flex; align-items:center; gap:10px;
  font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#ffb4d7; margin-bottom:10px;
}
#theme-toggle{
  position:absolute; top:14px; right:14px; z-index:2;
  width:42px; height:42px; border-radius:50%; cursor:pointer;
  border:1px solid rgba(255,245,232,.4); background:rgba(55,12,60,.55); color:#fff8fb;
  font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center;
}
#theme-toggle:hover{background:rgba(55,12,60,.85)}
.hero .eyebrow::before{content:""; width:28px; height:2px; background:currentColor; box-shadow:0 5px 0 #c88b50}
.hero h1{position:relative; z-index:1; margin:0; font-size:clamp(30px,5vw,44px); line-height:1; letter-spacing:-.045em; color:#fff8fb}
.hero p{position:relative; z-index:1; margin:10px 0 0; color:#f3dceb; font-size:15px}
/* ---- tabs ---- */
#tabs{
  position:sticky; top:52px; z-index:50;
  display:grid; grid-template-columns:repeat(4,1fr); gap:7px;
  width:min(860px,calc(100% - 24px)); margin:14px auto 18px; padding:7px;
  background:var(--surface); border:1px solid var(--line); border-bottom:4px solid var(--leather);
  border-radius:0 0 19px 19px; box-shadow:0 10px 30px rgba(74,25,76,.10);
}
#tabs button{
  min-height:46px; padding:9px 6px; border:0; border-radius:8px 8px 13px 13px;
  background:transparent; color:var(--muted); font-weight:800; font-size:13px;
  cursor:pointer; white-space:nowrap;
}
#tabs button.active{background:var(--deep); color:var(--deep-ink); box-shadow:inset 0 -3px 0 var(--leather)}
main{max-width:860px; margin:0 auto; padding:12px 12px 60px}
.tabpanel[hidden]{display:none}
/* ---- cards & rows ---- */
.card{
  position:relative; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-bottom:5px solid var(--leather);
  border-radius:12px 20px 20px 20px; box-shadow:var(--shadow);
  padding:27px 18px 16px; margin:0 0 18px;
}
.card::before{
  content:""; height:13px; position:absolute; left:0; right:0; top:0;
  background:repeating-linear-gradient(90deg,var(--sara) 0 18px,var(--cream) 18px 25px,var(--mike) 25px 43px,var(--cream) 43px 50px,var(--leather) 50px 59px);
}
.card h2{
  margin:-27px -18px 12px; padding:19px 20px 14px;
  font-size:17px; letter-spacing:-.02em; color:var(--ink);
  border-bottom:1px dashed var(--line);
  background-image:linear-gradient(135deg,transparent 84%,color-mix(in srgb,var(--sara) 13%,transparent) 84% 88%,transparent 88%),linear-gradient(45deg,transparent 84%,color-mix(in srgb,var(--mike) 12%,transparent) 84% 88%,transparent 88%);
  background-size:34px 34px;
}
.card h3{margin:14px 0 8px; font-size:15px; color:var(--ink)}
.row{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  padding:11px 2px; border-bottom:1px solid var(--line); width:100%;
}
.row:last-child{border-bottom:none}
.row .grow{flex:1 1 140px; min-width:120px}
label.fld{display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:800; color:var(--muted)}
input[type=text],input[type=number],select{
  font-size:15px; padding:7px 9px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink); max-width:100%; outline:none;
}
input:focus,select:focus{border-color:var(--sara); box-shadow:0 0 0 3px color-mix(in srgb,var(--sara) 18%,transparent)}
input[type=number]{width:96px; font-family:"DM Mono",monospace}
input[type=checkbox]{width:20px; height:20px; accent-color:var(--sara)}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:8px; padding:0;
  border:0; background:var(--line); border-radius:99px; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:24px; height:24px; border-radius:50%;
  background:var(--sara); border:4px solid var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%;
  background:var(--sara); border:4px solid var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;
}
button{font-family:inherit}
.btn{
  background:var(--sara); color:var(--sara-ink); border:0;
  border-bottom:3px solid color-mix(in srgb,var(--leather) 55%,transparent);
  border-radius:9px; padding:10px 16px; font-size:14px; font-weight:800; cursor:pointer;
}
.btn.secondary{background:var(--deep); color:var(--deep-ink); border-bottom:3px solid var(--leather)}
.btn.plain{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-bottom:3px solid var(--leather)}
.btn.danger{background:var(--sara); color:var(--sara-ink); border-bottom:3px solid color-mix(in srgb,var(--leather) 65%,transparent)}
.btn.small{padding:6px 12px; font-size:13px}
.iconbtn{
  background:none; border:none; font-size:18px; cursor:pointer; color:var(--muted);
  padding:4px 8px; line-height:1; border-radius:8px;
}
.iconbtn:hover{background:var(--sara-soft); color:var(--sara)}
/* owner tags */
.tag{
  display:inline-block; font-size:11px; font-weight:800; letter-spacing:.4px;
  padding:4px 10px; border-radius:20px; text-transform:uppercase;
}
.tag.Mike{background:var(--mike); color:var(--mike-ink)}
.tag.Sara{background:var(--sara); color:var(--sara-ink)}
.tag.Shared{background:var(--shared); color:var(--shared-ink)}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 8px}
.chips button{
  border:0; background:transparent; border-radius:9px;
  padding:8px 14px; font-size:13px; font-weight:800; color:var(--muted); cursor:pointer;
}
.chips button.active{background:var(--deep); color:var(--deep-ink); box-shadow:inset 0 -3px 0 var(--leather)}
.money{font-family:"DM Mono",monospace; font-weight:500; font-variant-numeric:tabular-nums}
.big{font-size:clamp(34px,7vw,52px); letter-spacing:-.04em}
.muted{color:var(--muted); font-size:13px}
.ok{color:var(--mike); font-weight:700}
.warn{color:var(--shared); font-weight:700}
.bad{color:var(--danger); font-weight:700}
.progress{height:12px; background:var(--surface-2); border-radius:8px; overflow:hidden; margin-top:8px}
.progress > div{height:100%; background:linear-gradient(90deg,var(--sara),var(--mike)); border-radius:8px}
/* pot + snapshots */
.grid2{display:grid; grid-template-columns:1fr; gap:12px}
.snap{border:1px solid var(--line); border-left:6px solid var(--shared); padding:12px 14px; background:var(--surface-2); border-radius:10px}
.snap.Mike{border-left-color:var(--mike)}
.snap.Sara{border-left-color:var(--sara)}
.snap .kv{display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:3px 0}
/* calendar */
.cal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 10px}
.cal-head h2{margin:0; padding:0; border:0; background:none; font-size:20px; letter-spacing:-.02em}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal-dow{font-size:10px; font-weight:800; color:var(--muted); text-align:center; padding:6px 0; text-transform:uppercase; letter-spacing:.06em}
.cell{
  min-height:52px; border:1px solid var(--line); border-radius:10px; background:var(--surface);
  font-size:14px; font-family:"DM Mono",monospace; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:6px 2px; color:var(--ink); position:relative;
}
.cell.blank{background:transparent; border-color:transparent; cursor:default}
.cell.today{box-shadow:inset 0 0 0 2px var(--sara)}
.cell.today .dnum{color:var(--sara); font-weight:700}
.cell .dnum{font-weight:500}
.cell .dots{display:none; gap:3px; margin-top:4px; flex-wrap:wrap; justify-content:center}
.cell .dot{width:7px; height:7px; border-radius:50%}
.dot.Mike{background:var(--mike)} .dot.Sara{background:var(--sara)} .dot.Shared{background:var(--shared)}
/* overlays */
.overlay{
  position:fixed; inset:0; z-index:80; background:rgba(20,10,18,.62);
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.overlay[hidden]{display:none}
.modal,.popup{
  background:var(--surface); border:1px solid var(--line); border-bottom:5px solid var(--sara);
  border-radius:16px 16px 22px 22px; box-shadow:0 24px 80px rgba(24,12,20,.44);
  padding:22px; max-width:430px; width:100%; max-height:85vh; overflow:auto;
}
.modal p{font-size:15px; margin:0 0 18px; color:var(--ink)}
.modal-actions{display:flex; gap:9px; justify-content:flex-end}
.popup{position:relative}
.popup h3{margin:0 0 12px; color:var(--ink); font-size:18px; padding-right:30px}
#day-close{
  position:absolute; top:10px; right:12px; width:36px; height:36px; padding:0;
  border:1px solid var(--line); border-radius:50%; background:var(--surface-2);
  color:var(--ink); font-size:20px; line-height:1; cursor:pointer;
}
.day-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.day-item:last-child{border:none}
/* add forms */
.addform{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line)}
.flash{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:90;
  background:var(--ink); color:var(--surface); padding:12px 18px; border-radius:10px;
  font-size:13px; font-weight:700; box-shadow:var(--shadow);
}
@media (min-width:720px){
  .grid2{grid-template-columns:1fr 1fr}
  .cell{min-height:68px}
  .cell .dots{display:flex}
}
@media (max-width:560px){
  .hero{margin-top:10px; padding:24px 20px; border-radius:20px 20px 10px 10px}
  #tabs{gap:4px; padding:5px}
  #tabs button{min-height:44px; font-size:12px; padding:7px 4px}
  .card{padding:25px 14px 14px}
  .card h2{margin:-25px -14px 10px; padding:16px 14px 12px}
  .cal-grid{gap:3px}
  .cell{min-height:46px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

</style>
</head>
<body>
<div id="savebar">
  <span id="save-indicator" class="saving">Loading…</span>
  <button id="reset-btn" type="button">Reset to defaults</button>
</div>
<header class="hero">
  <button id="theme-toggle" type="button" aria-label="Theme: auto — tap to change" title="Theme: auto (tap to change)">◐</button>
  <h1>Household Budget</h1>
</header>
<nav id="tabs">
  <button type="button" data-tab="overview" class="active">Overview</button>
  <button type="button" data-tab="income">Income &amp; bills</button>
  <button type="button" data-tab="spending">Spending &amp; debt</button>
  <button type="button" data-tab="calendar">Calendar</button>
</nav>
<main>
  <section id="tab-overview" class="tabpanel"></section>
  <section id="tab-income" class="tabpanel" hidden></section>
  <section id="tab-spending" class="tabpanel" hidden></section>
  <section id="tab-calendar" class="tabpanel" hidden></section>
</main>
<div id="modal-overlay" class="overlay" hidden>
  <div class="modal">
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button id="modal-cancel" type="button" class="btn plain">Keep item</button>
      <button id="modal-confirm" type="button" class="btn danger">Delete item</button>
    </div>
  </div>
</div>
<div id="day-overlay" class="overlay" hidden>
  <div class="popup">
    <button id="day-close" type="button" aria-label="Close">×</button>
    <h3 id="day-title"></h3>
    <div id="day-list"></div>
  </div>
</div>
<script>
/* ================= utils ================= */
function uid(){ return 'x' + Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function fmt(n){ n=num(n); var neg=n<0; n=Math.abs(n); return (neg?'-$':'$')+n.toFixed(2); }
function ownerTag(o){ return '<span class="tag '+esc(o)+'">'+esc(o)+'</span>'; }
function monthName(m){ return ['January','February','March','April','May','June','July','August','September','October','November','December'][m]; }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function todayParts(){ var d=new Date(); return {y:d.getFullYear(),m:d.getMonth(),d:d.getDate()}; }

/* ================= seed data ================= */
function mkBill(name,amount,owner,paidBy,day){
  return {id:uid(),name:name,amount:amount,owner:owner,paidBy:paidBy,day:(day==null?null:day),splitMike:50,splitSara:50,enabled:true};
}
function seedState(){
  return {
    income:[
      {id:uid(),name:'SEAPCO paycheck',owner:'Mike',amount:1300,per:'paycheck',note:'15th & last day of month'},
      {id:uid(),name:'Spark delivery',owner:'Sara',amount:0,per:'month',note:'variable — update as known'}
    ],
    bills:[
      mkBill('Netflix',26.99,'Mike','Mike',15),
      mkBill('YouTube Premium',9.91,'Mike','Mike',null),
      mkBill('AMC Theatres',28.83,'Mike','Mike',null),
      mkBill('Audible',14.95,'Mike','Mike',null),
      mkBill('Amazon Prime',6.99,'Mike','Mike',null),
      mkBill('Discord Nitro',11.03,'Mike','Mike',null),
      mkBill('Patreon — Quinns Quest',3.31,'Mike','Mike',null),
      mkBill('Patreon',4.40,'Mike','Mike',null),
      mkBill('DoorDash DashPass',9.99,'Mike','Mike',null),
      mkBill('Apple App Store',12.99,'Mike','Mike',null),
      mkBill('Google One',2.29,'Mike','Mike',null),
      mkBill('Obsidian',6.90,'Mike','Mike',null),
      mkBill('Obsidian (2nd)',6.90,'Mike','Mike',null),
      mkBill('SoFi investing',25,'Mike','Mike',15),
      mkBill('Mortgage',500,'Shared','Sara',15),
      mkBill('Cedar Street Mini Storage',60,'Shared','Sara',15)
    ],
    transfers:[
      {id:uid(),name:'Transfer to Sara',amount:750,day:15},
      {id:uid(),name:'Transfer to Sara',amount:750,day:30}
    ],
    pools:[
      {id:uid(),name:'Christmas',owner:'Mike',target:1200,balance:0}
    ],
    debts:[
      {id:uid(),name:'First Premier',amount:384,owner:'Mike',note:'due Oct 26'}
    ],
    other:[],
    sliders:{Mike:250,Sara:100},
    spark:{taxPct:0,carCosts:0,extraSpending:0,workingWeeks:4.33},
    billFilter:'All',
    calCursor:null
  };
}
function normalizeState(s){
  var d=seedState();
  if(!s||typeof s!=='object') return d;
  Object.keys(d).forEach(function(k){ if(s[k]!==undefined&&s[k]!==null) d[k]=s[k]; });
  if(!d.sliders) d.sliders={Mike:250,Sara:100};
  if(!d.spark) d.spark={taxPct:0,carCosts:0,extraSpending:0,workingWeeks:4.33};
  return d;
}
var state = seedState();

/* ================= calculations ================= */
function enabledBills(){ return state.bills.filter(function(b){return b.enabled;}); }
function incomeMonthly(who){
  return state.income.filter(function(i){return i.owner===who;})
    .reduce(function(s,i){ return s + num(i.amount)*(i.per==='paycheck'?2:1); },0);
}
function billsPaidBy(who){
  return enabledBills().filter(function(b){return b.paidBy===who;})
    .reduce(function(s,b){ return s+num(b.amount); },0);
}
function sharedBillsTotal(){
  return enabledBills().filter(function(b){return b.owner==='Shared';})
    .reduce(function(s,b){ return s+num(b.amount); },0);
}
function transfersTotal(){
  return state.transfers.reduce(function(s,t){ return s+num(t.amount); },0);
}
function suggested(who){
  var inc=incomeMonthly(who), bills=billsPaidBy(who), slider=num(state.sliders[who]), t=transfersTotal();
  if(who==='Mike') return inc - bills - t - slider;
  return inc + t - bills - slider; /* Sara: transfers are inflow */
}
function pot(){ var tin=transfersTotal(), out=sharedBillsTotal(); return {tin:tin,out:out,surplus:tin-out}; }
function saraMonthlyNeed(){
  var saraOwn=enabledBills().filter(function(b){return b.owner==='Sara';})
    .reduce(function(s,b){ return s+num(b.amount); },0);
  return saraOwn + sharedBillsTotal()/2;
}
function sparkTarget(){
  var sp=state.spark, weeks=num(sp.workingWeeks)||4.33;
  var denom=1-num(sp.taxPct)/100; if(!(denom>0)) denom=1;
  var grossMonthly=(saraMonthlyNeed()+(num(sp.carCosts)+num(sp.extraSpending))*weeks)/denom;
  return Math.ceil(grossMonthly/weeks-1e-9);
}

var SUPABASE_URL='https://aysnrdjkfzpslpubgfru.supabase.co';
var SUPABASE_KEY='sb_publishable_29VqvNEq6jljDrbFrNQdIQ_V01R9y4O';
var saveTimer=null, savePending=false;

function setIndicator(mode,when){
  var el=document.getElementById('save-indicator');
  el.className='';
  if(mode==='loading'){ el.textContent='Loading…'; el.className='saving'; }
  else if(mode==='saving'){ el.textContent='Saving…'; el.className='saving'; }
  else if(mode==='saved'){
    var t=when||new Date(), h=t.getHours(), m=t.getMinutes(), ap=h>=12?'PM':'AM';
    h=h%12; if(h===0)h=12;
    el.textContent='Saved ✓ '+h+':'+(m<10?'0':'')+m+' '+ap; el.className='saved';
  }
  else if(mode==='offline'){ el.textContent='Offline — will retry'; el.className='offline'; }
  else if(mode==='ready'){ el.textContent='Ready — changes save automatically'; el.className='saved'; }
}
function markDirty(){
  render();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(persist,1000);
}
async function persist(){
  saveTimer=null;
  setIndicator('saving');
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/budget_state?id=eq.shared',{
      method:'PATCH',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({data:state,updated_at:new Date().toISOString()})
    });
    if(!r.ok) throw new Error('http '+r.status);
    savePending=false;
    setIndicator('saved',new Date());
  }catch(e){
    savePending=true;
    setIndicator('offline');
  }
}
async function loadFromServer(){
  setIndicator('loading');
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/budget_state?id=eq.shared&select=data',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    if(!r.ok) throw new Error('http '+r.status);
    var j=await r.json();
    if(j&&j.length&&j[0].data&&Object.keys(j[0].data).length){
      state=normalizeState(j[0].data);
      setIndicator('saved',new Date());
    }else{
      setIndicator('ready');
    }
  }catch(e){
    setIndicator('offline');
  }
  render();
}
window.addEventListener('online',function(){ if(savePending){ persist(); } });

/* ================= events / calendar data ================= */
function eventsForDay(y,m,d){
  var ev=[];
  enabledBills().forEach(function(b){
    if(b.day===d) ev.push({label:b.name,amount:num(b.amount),tag:b.owner,kind:'bill'});
  });
  state.transfers.forEach(function(t){
    if(num(t.day)===d) ev.push({label:t.name+' — Mike to Sara',amount:num(t.amount),tag:'Shared',kind:'transfer'});
  });
  var last=daysInMonth(y,m);
  if(d===15||d===last) ev.push({label:'SEAPCO paycheck (Mike)',amount:1300,tag:'Mike',kind:'income'});
  return ev;
}
function upcomingEvents(n){
  var out=[], t=todayParts();
  for(var i=0;i<=n;i++){
    var dt=new Date(t.y,t.m,t.d+i);
    var evs=eventsForDay(dt.getFullYear(),dt.getMonth(),dt.getDate());
    if(evs.length) out.push({date:dt,events:evs});
  }
  return out;
}
function fmtDate(d){ return monthName(d.getMonth()).slice(0,3)+' '+d.getDate(); }

  html+='<div class="card"><h2>Debt payments</h2>';
  state.debts.forEach(function(d){
    html+='<div class="row"><input class="grow" type="text" value="'+esc(d.name)+'" onchange="debtField(\''+d.id+'\',\'name\',this.value)" aria-label="Debt name">'+
      '<label class="fld">Amount<input type="number" step="0.01" min="0" value="'+esc(d.amount)+'" onchange="debtField(\''+d.id+'\',\'amount\',this.value)"></label>'+
      '<label class="fld">Owner<select onchange="debtField(\''+d.id+'\',\'owner\',this.value)">'+ownerOpts(d.owner)+'</select></label>'+
      '<input class="grow" type="text" placeholder="Note" value="'+esc(d.note||'')+'" onchange="debtField(\''+d.id+'\',\'note\',this.value)" aria-label="Note">'+
      '<button type="button" class="iconbtn" onclick="delDebt(\''+d.id+'\')" aria-label="Delete">🗑</button></div>';
  });
  html+='<div class="addform"><input type="text" id="nd-name" placeholder="Debt name" class="grow">'+
    '<input type="number" id="nd-amount" placeholder="$" step="0.01" min="0">'+
    '<select id="nd-owner"><option>Mike</option><option>Sara</option><option>Shared</option></select>'+
    '<button type="button" class="btn small" onclick="addDebt()">Add debt</button></div></div>';
  html+='<div class="card"><h2>Other planned spending</h2>';
  state.other.forEach(function(o){
    html+='<div class="row"><input class="grow" type="text" value="'+esc(o.name)+'" onchange="otherField(\''+o.id+'\',\'name\',this.value)" aria-label="Item name">'+
      '<label class="fld">Amount<input type="number" step="0.01" min="0" value="'+esc(o.amount)+'" onchange="otherField(\''+o.id+'\',\'amount\',this.value)"></label>'+
      '<label class="fld">Owner<select onchange="otherField(\''+o.id+'\',\'owner\',this.value)">'+ownerOpts(o.owner)+'</select></label>'+
      '<button type="button" class="iconbtn" onclick="delOther(\''+o.id+'\')" aria-label="Delete">🗑</button></div>';
  });
  html+='<div class="addform"><input type="text" id="no-name" placeholder="Item name" class="grow">'+
    '<input type="number" id="no-amount" placeholder="$" step="0.01" min="0">'+
    '<select id="no-owner"><option>Mike</option><option>Sara</option><option>Shared</option></select>'+
    '<button type="button" class="btn small" onclick="addOther()">Add item</button></div></div>';
  document.getElementById('tab-spending').innerHTML=html;
}
function findPool(id){ return state.pools.find(function(p){return p.id===id;}); }
function poolField(id,field,val){
  var p=findPool(id); if(!p) return;
  if(field==='target'||field==='balance') p[field]=num(val); else p[field]=val;
  markDirty();
}
function delPool(id){
  var p=findPool(id); if(!p) return;
  askConfirm('Delete savings pool "'+p.name+'"? Are you sure?','Delete item','Keep item',function(){
    state.pools=state.pools.filter(function(x){return x.id!==id;}); markDirty();
  });
}
function addPool(){
  var n=document.getElementById('np-name').value.trim(); if(!n){flash('Name the pool first');return;}
  state.pools.push({id:uid(),name:n,owner:document.getElementById('np-owner').value,
    target:num(document.getElementById('np-target').value),balance:0});
  markDirty();
}
function sliderInput(who,val){
  state.sliders[who]=num(val);
  var key=who.toLowerCase(), s=suggested(who);
  var vEl=document.getElementById('sl-'+key+'-val'); if(vEl) vEl.textContent=fmt(val);
  var sEl=document.getElementById('sug-'+key); if(sEl){ sEl.textContent=fmt(s); sEl.className='money '+(s<0?'bad':'ok'); }
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(persist,1000);
}
function sliderDone(){ markDirty(); }
function findDebt(id){ return state.debts.find(function(d){return d.id===id;}); }
function debtField(id,field,val){
  var d=findDebt(id); if(!d) return;
  d[field]=(field==='amount')?num(val):val; markDirty();
}
function delDebt(id){
  var d=findDebt(id); if(!d) return;
  askConfirm('Delete debt payment "'+d.name+'"? Are you sure?','Delete item','Keep item',function(){
    state.debts=state.debts.filter(function(x){return x.id!==id;}); markDirty();
  });
}
function addDebt(){
  var n=document.getElementById('nd-name').value.trim(); if(!n){flash('Name the debt first');return;}
  state.debts.push({id:uid(),name:n,amount:num(document.getElementById('nd-amount').value),
    owner:document.getElementById('nd-owner').value,note:''});
  markDirty();
}
function findOther(id){ return state.other.find(function(o){return o.id===id;}); }
function otherField(id,field,val){
  var o=findOther(id); if(!o) return;
  o[field]=(field==='amount')?num(val):val; markDirty();
}
function delOther(id){
  var o=findOther(id); if(!o) return;
  askConfirm('Delete "'+o.name+'"? Are you sure?','Delete item','Keep item',function(){
    state.other=state.other.filter(function(x){return x.id!==id;}); markDirty();
  });
}
function addOther(){
  var n=document.getElementById('no-name').value.trim(); if(!n){flash('Name the item first');return;}
  state.other.push({id:uid(),name:n,amount:num(document.getElementById('no-amount').value),
    owner:document.getElementById('no-owner').value});
  markDirty();
}

/* ================= CALENDAR ================= */
function calCursor(){
  if(state.calCursor&&state.calCursor.y!=null) return state.calCursor;
  var t=todayParts(); return {y:t.y,m:t.m};
}
function renderCalendar(){
  var c=calCursor(), t=todayParts();
  var first=new Date(c.y,c.m,1).getDay(), dim=daysInMonth(c.y,c.m);
  var html='<div class="card"><div class="cal-head">'+
    '<button type="button" class="btn plain small" onclick="calNav(-1)" aria-label="Previous month">‹</button>'+
    '<h2>'+monthName(c.m)+' '+c.y+'</h2>'+
    '<button type="button" class="btn plain small" onclick="calNav(1)" aria-label="Next month">›</button></div>'+
    '<div style="text-align:center;margin-bottom:8px"><button type="button" class="btn plain small" onclick="calToday()">This month</button></div>'+
    '<div class="cal-grid">';
  ['S','M','T','W','T','F','S'].forEach(function(d){ html+='<div class="cal-dow">'+d+'</div>'; });
  for(var i=0;i<first;i++) html+='<div class="cell blank"></div>';
  for(var d=1;d<=dim;d++){
    var evs=eventsForDay(c.y,c.m,d);
    var dots=evs.slice(0,4).map(function(e){ return '<span class="dot '+esc(e.tag)+'"></span>'; }).join('');
    var cls='cell'+((d===t.d&&c.m===t.m&&c.y===t.y)?' today':'');
    html+='<button type="button" class="'+cls+'" onclick="openDay('+c.y+','+c.m+','+d+')"><span class="dnum">'+d+'</span><span class="dots">'+dots+'</span></button>';
  }
  html+='</div><p class="muted">Tap a date to see what\u2019s owed that day.</p></div>';
  document.getElementById('tab-calendar').innerHTML=html;
}
function calNav(dir){
  var c=calCursor(), m=c.m+dir, y=c.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  state.calCursor={y:y,m:m}; markDirty();
}
function calToday(){ state.calCursor=null; markDirty(); }
function openDay(y,m,d){
  var evs=eventsForDay(y,m,d);
  document.getElementById('day-title').textContent=monthName(m)+' '+d+', '+y;
  var h='';
  if(!evs.length) h='<p class="muted">Nothing owed this day.</p>';
  evs.forEach(function(e){
    h+='<div class="day-item"><span>'+esc(e.label)+'<br>'+ownerTag(e.tag)+'</span><span class="money">'+fmt(e.amount)+'</span></div>';
  });
  document.getElementById('day-list').innerHTML=h;
  document.getElementById('day-overlay').hidden=false;
}
/* ================= copy / download / reset ================= */
function buildPlanText(){
  var L=[];
  L.push('HOUSEHOLD BUDGET PLAN');
  L.push('Income: Mike '+fmt(incomeMonthly('Mike'))+'/mo | Sara '+fmt(incomeMonthly('Sara'))+'/mo');
  L.push('Bills paid by Mike: '+fmt(billsPaidBy('Mike'))+'/mo | by Sara: '+fmt(billsPaidBy('Sara'))+'/mo');
  var p=pot();
  L.push('Transfers to Sara: '+fmt(p.tin)+'/mo | Shared bills: '+fmt(p.out)+'/mo | Pot surplus: '+fmt(p.surplus));
  L.push('Extra spending: Mike '+fmt(state.sliders.Mike)+'/mo | Sara '+fmt(state.sliders.Sara)+'/mo');
  L.push('Suggested savings: Mike '+fmt(suggested('Mike'))+' | Sara '+fmt(suggested('Sara')));
  L.push('Savings pools:');
  state.pools.forEach(function(pl){ L.push('  - '+pl.name+' ('+pl.owner+'): '+fmt(pl.balance)+' / '+fmt(pl.target)); });
  if(state.debts.length){
    L.push('Debt payments:');
    state.debts.forEach(function(d){ L.push('  - '+d.name+' ('+d.owner+'): '+fmt(d.amount)+(d.note?' — '+d.note:'')); });
  }
  L.push('Sara Spark weekly target: '+fmt(sparkTarget()));
  return L.join('\n');
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function copyPlan(){
  var t=buildPlanText();
  function done(){ flash('Plan copied to clipboard'); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(function(){ fallbackCopy(t); done(); });
  }else{ fallbackCopy(t); done(); }
}
function downloadJSON(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='household-budget.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
  flash('Downloaded household-budget.json');
}
function wireReset(){
  document.getElementById('reset-btn').addEventListener('click',function(){
    askConfirm('Reset everything to the published defaults? Are you sure?','Reset to defaults','Keep my numbers',function(){
      var headers={
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      };
      fetch(SUPABASE_URL+'/rest/v1/budget_state?id=eq.shared',{
        method:'PATCH',headers:headers,
        body:JSON.stringify({data:{},updated_at:new Date().toISOString()})
      }).catch(function(){});
      state=seedState();
      setIndicator('saved',new Date());
      render();
    });
  });
}

/* ================= render + init ================= */
function render(){
  renderOverview();
  renderIncome();
  renderSpending();
  renderCalendar();
}
/* ================= theme toggle (per-device, stored locally) ================= */
var THEMES=['auto','dark','light'];
var THEME_ICONS={auto:'◐',dark:'☾',light:'☀'};
function currentTheme(){
  var t=null;
  try{ t=localStorage.getItem('budget-theme'); }catch(e){}
  return THEMES.indexOf(t)>=0 ? t : 'auto';
}
function applyTheme(){
  var t=currentTheme();
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  var el=document.getElementById('theme-toggle');
  if(el){
    el.textContent=THEME_ICONS[t];
    el.setAttribute('aria-label','Theme: '+t+' — tap to change');
    el.title='Theme: '+t+' (tap to change)';
  }
}
function cycleTheme(){
  var t=currentTheme();
  var next=THEMES[(THEMES.indexOf(t)+1)%THEMES.length];
  try{ localStorage.setItem('budget-theme',next); }catch(e){}
  applyTheme();
}
applyTheme();

document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      var t=b.getAttribute('data-tab');
      document.querySelectorAll('.tabpanel').forEach(function(p){ p.hidden=true; });
      document.getElementById('tab-'+t).hidden=false;
    });
  });
  document.getElementById('modal-cancel').addEventListener('click',hideModal);
  document.getElementById('modal-confirm').addEventListener('click',function(){
    var a=modalAction; hideModal(); if(a) a();
  });
  document.getElementById('modal-overlay').addEventListener('click',function(e){
    if(e.target===this) hideModal();
  });
  document.getElementById('day-close').addEventListener('click',function(){
    document.getElementById('day-overlay').hidden=true;
  });
  document.getElementById('day-overlay').addEventListener('click',function(e){
    if(e.target===this) this.hidden=true;
  });
  wireReset();
  document.getElementById('theme-toggle').addEventListener('click',cycleTheme);
  applyTheme();
  render();
  loadFromServer();
});
</script>
